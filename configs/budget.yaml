# Per-run budget (spec 02, item 3). Identical for all agents and models within a phase.
max_tool_calls: 30          # search + get_document
max_get_document: 10        # of the 30
max_model_calls: 40         # includes planning and ledger turns; the final-answer request is extra
max_output_tokens: 16000    # per model call, thinking included
max_wall_minutes: 15
cost_cap_usd:               # per run; ~5x the expected average from the budget estimate
  phase1: 0.40              # smoke runs use the cap of the model's own phase
  phase2: 1.50
  debug: 0.40
# Plan-and-Execute: a step is blocked after this many tool calls in a row that surface no new docid
blocked_after_unproductive_calls: 3
# Degenerate output (spec 02, item 7)
degenerate:
  min_visible_chars: 200     # non-whitespace characters in the visible text
  max_repeated_line: 20      # one line repeated this many times
  retries: 2

# Runner caps (spec 03, item 3). The runner stops before a run that could cross a cap.
caps_usd:
  smoke: 4.0                # smoke test and debugging
  phase1: 6.0
  phase2: 13.0
  total: 30.0               # Anthropic + OpenAI + OpenRouter (judge, query embeddings); not Gemini
  google_credits: 15.0      # Gemini, billed to Google AI Pro developer credits
  evidence: 2.0             # controlled-evidence check (spec 04, item 14); per-run cap = the model's phase
  pefix: 2.0                # Plan-and-Execute fix reruns (Luna and Terra cells); per-run cap = the model's phase
# Controlled-evidence check: gold documents put into the first prompt (qrels order), 4,096 tokens each
evidence_max_context_docs: 3
# Spending before the runner existed that no trace or judge cache records (spec 01/02 checks).
prior_spend_usd: {total: 0.02, google_credits: 0.10}
# Dry-run estimate per run when no smoke-test traces exist yet (from the README budget).
fallback_estimate_usd_per_run: {phase1: 0.07, phase2: 0.30}
max_attempts: 4             # 1 try + up to 3 retries with the same settings, then `missing`
